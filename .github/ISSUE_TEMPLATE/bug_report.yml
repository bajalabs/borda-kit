name: Bug report
description: Something in the kit does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Paste the error output if a build failed.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest content (a site.json and a board file) and the command that shows the problem. Use invented data, never real people's details.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release or commit of borda-kit your copy started from.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node.js and pnpm versions, operating system, and the host you deploy to.
