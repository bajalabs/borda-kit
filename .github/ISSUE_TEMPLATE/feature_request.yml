name: Feature request
description: Propose something the kit should do for every brand that uses it.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and why the kit makes it hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: How it could work, including any change to the content format.
